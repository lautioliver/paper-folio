name: Hallazgo de auditoría
description: Un issue por hallazgo de una auditoría
labels: ["tipo:audit", "estado:a-triar"]
body:
  - type: markdown
    attributes:
      value: "Título: `Auditoría <área>: <hallazgo>`. Ej.: *Auditoría pagos: el webhook no es idempotente*."
  - type: input
    id: documento
    attributes: { label: Documento de auditoría, description: "Link al archivo en docs/development/auditorias/<tema>.md y el ID del hallazgo (UX-<área>-NN, ej. UX-SITIO-01)." }
    validations: { required: true }
  - type: textarea
    id: hallazgo
    attributes: { label: Hallazgo, description: Qué se encontró y dónde (archivos). }
    validations: { required: true }
  - type: textarea
    id: riesgo
    attributes: { label: Riesgo }
  - type: textarea
    id: propuesta
    attributes: { label: Propuesta de arreglo }
