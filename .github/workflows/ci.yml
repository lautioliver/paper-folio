# .github/workflows/ci.yml — Paperfolio
# Corre lint, typecheck y tests del proyecto Next.js en cada PR y en cada push a main.
# Sin secretos: los tests no usan servicios externos. Node sale de .nvmrc.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior (ya obsoleta).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
