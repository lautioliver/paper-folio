# .github/workflows/ci.yml — Paperfolio
# Corre lint, typecheck y tests del proyecto Next.js en cada PR y en cada push a main.
# Sin secretos. Node sale de .nvmrc. Los tests de la base usan mongodb-memory-server: la primera
# corrida sin caché descarga el binario de mongod (~80 MB) de fastdl.mongodb.org.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un push nuevo a un PR cancela la corrida anterior (obsoleta). En main no se cancela nada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm no corre el postinstall de mongodb-memory-server (allowScripts): mongod se descarga
      # en el primer test. Se cachea entre corridas; la clave cambia con el lock (nueva versión).
      - name: Caché del binario de mongod
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongod-${{ runner.os }}-
      - name: Instalar dependencias
        id: instalar
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run typecheck
      - name: Tests
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm test
